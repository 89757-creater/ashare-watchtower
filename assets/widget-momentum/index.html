<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 动量榜 · 每日强势主题</title>
<style>
  /* kimi-host-safe-zone */
  :root {
    --daimon-widget-host-safe-inline-end: 190px;
    --daimon-widget-host-safe-block-start: 44px;
  }
  .kimi-host-safe-context { container-type: inline-size; }
  .kimi-host-safe-header {
    box-sizing: border-box;
    min-block-size: var(--daimon-widget-host-safe-block-start, 44px);
    padding-inline-end: var(--daimon-widget-host-safe-inline-end, 190px);
  }
  @container (max-width: 419px) {
    .kimi-host-safe-header {
      min-block-size: 0;
      padding-block-start: var(--daimon-widget-host-safe-block-start, 44px);
      padding-inline-end: 0;
    }
  }
  /* kimi-fit */
  [data-kimi-root] { box-sizing: border-box; inline-size: 100%; min-inline-size: 0; max-inline-size: 100%; overflow: visible; }
  [data-kimi-root] * { box-sizing: border-box; min-inline-size: 0; }
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p1"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p2"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p3"] { display: none !important; }

  html, body { margin: 0; padding: 0; background: transparent; }
  .widget {
    font-family: var(--kimi-font-sans);
    color: var(--kimi-color-text-primary);
    padding: 4px 14px 10px 14px;
    letter-spacing: 0;
  }
  /* A股涨跌色（表征性约定：涨红跌绿，两态一条状态轴） */
  .up   { color: #d43c33; }
  .down { color: #15924e; }
  .flat { color: var(--kimi-color-text-tertiary); }

  header h1 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--kimi-color-text-primary);
    display: inline;
  }
  .asof {
    margin-left: 8px;
    font-size: 11.5px;
    color: var(--kimi-color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  /* P0：榜首主线一句话 */
  .p0 {
    margin: 6px 0 2px;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
  }
  .p0 .lead { font-size: 12.5px; color: var(--kimi-color-text-secondary); }
  .p0 .winner { font-size: 20px; font-weight: 500; line-height: 1.1; }
  .p0 output {
    display: inline-block;
    font-size: 26px;
    font-weight: 500;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--kimi-color-border);
    color: var(--kimi-color-text-secondary);
    white-space: nowrap;
  }
  .tag.hot { color: #d43c33; border-color: #d43c33; }
  .tag.weak { color: var(--kimi-color-text-tertiary); }

  /* 波段信号 pill（蓝=低吸，橙=高抛，灰=其他） */
  .sig {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--kimi-color-border);
    color: var(--kimi-color-text-tertiary);
    white-space: nowrap;
  }
  .sig.buy { color: var(--kimi-color-accent); border-color: var(--kimi-color-accent); }
  .sig.sell { color: var(--kimi-color-warning); border-color: var(--kimi-color-warning); }

  /* 低吸潜力条 */
  .picks {
    margin: 8px 0 2px;
    padding: 7px 9px;
    border-radius: 8px;
    background: var(--kimi-color-surface-muted);
    border-inline-start: 3px solid var(--kimi-color-accent);
  }
  .picks .pk-title {
    font-size: 11.5px;
    color: var(--kimi-color-text-tertiary);
    margin-bottom: 4px;
  }
  .pick {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 12px;
    line-height: 1.6;
  }
  .pick .pn { font-weight: 600; }
  .pick .pr { color: var(--kimi-color-text-tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }
  .pick.holding .pn::after {
    content: "★";
    margin-left: 4px;
    font-size: 10px;
    color: var(--kimi-color-accent);
  }

  /* 市场状态条 */
  .market {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 8px 0 4px;
    padding: 7px 0;
    border-top: 1px solid var(--kimi-color-border);
    border-bottom: 1px solid var(--kimi-color-border);
  }
  .mitem { display: flex; align-items: baseline; gap: 5px; font-size: 12px; }
  .mitem .mname { color: var(--kimi-color-text-secondary); }
  .mitem output { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 12.5px; }
  .mitem .m5 { color: var(--kimi-color-text-tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* 排名表 */
  .table { margin-top: 6px; }
  .trow {
    display: grid;
    grid-template-columns: 20px minmax(0, 1.35fr) minmax(0, 1.6fr) 52px;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--kimi-color-border);
    font-size: 12.5px;
  }
  .trow:last-child { border-bottom: none; }
  .trow.head {
    padding: 2px 0 4px;
    font-size: 11px;
    color: var(--kimi-color-text-tertiary);
    border-bottom: 1px solid var(--kimi-color-border);
  }
  .rank { font-variant-numeric: tabular-nums; color: var(--kimi-color-text-tertiary); font-size: 11.5px; }
  .trow.top .rank { color: var(--kimi-color-text-primary); font-weight: 500; }
  .name { min-width: 0; }
  .name .n {
    display: block;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name .c {
    display: block;
    font-size: 10.5px;
    color: var(--kimi-color-text-quaternary);
    font-variant-numeric: tabular-nums;
  }
  .holding .n::after {
    content: "★ 持仓";
    margin-left: 5px;
    font-size: 10px;
    font-weight: 500;
    color: var(--kimi-color-accent);
  }
  /* 动量条：以 0 为共享基线 */
  .bar-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .bar-track {
    position: relative;
    flex: 1;
    height: 12px;
    min-width: 40px;
  }
  .bar-track::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--kimi-color-border);
  }
  .bar {
    position: absolute;
    top: 2px; bottom: 2px;
    border-radius: 2px;
  }
  .bar.pos { left: 50%; background: #d43c33; }
  .bar.neg { right: 50%; background: #15924e; }
  .bar-val {
    width: 46px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    font-size: 12.5px;
  }
  .tagcell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .tagcell .tag { padding: 1px 6px; }

  /* 宽版增列 */
  .col-wide { display: none; }
  @media (min-width: 620px) {
    .trow { grid-template-columns: 22px minmax(0, 1.2fr) 70px minmax(0, 1.5fr) 52px 44px 44px 64px; }
    .col-wide { display: block; }
  }
  .num { font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }

  .more-note {
    margin: 6px 0 0;
    font-size: 11px;
    color: var(--kimi-color-text-tertiary);
  }
  footer {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--kimi-color-border);
    font-size: 10.5px;
    color: var(--kimi-color-text-quaternary);
    line-height: 1.5;
  }
  .empty {
    padding: 18px 0;
    font-size: 12.5px;
    color: var(--kimi-color-text-tertiary);
  }
</style>
</head>
<body>
<main class="widget kimi-host-safe-context" data-kimi-root>
  <header class="kimi-host-safe-header" data-kimi-priority="p0">
    <h1>ETF 动量榜</h1><span class="asof" data-f="asof">—</span>
    <p class="p0" aria-label="今日最强主线">
      <span class="lead">最强主线</span>
      <strong class="winner" data-f="winner">—</strong>
      <output data-f="winner_ret" aria-label="近5日涨跌幅">—</output>
      <span class="tag" data-f="winner_tag">—</span>
    </p>
  </header>

  <section class="picks" data-kimi-priority="p1" aria-label="低吸潜力" data-picks hidden>
    <p class="pk-title">低买高卖 · 低吸潜力（20日区间低位）</p>
    <div data-pick-rows></div>
  </section>

  <section class="market" data-kimi-priority="p1" aria-label="大盘状态" data-market></section>

  <section class="table" data-kimi-priority="p1" aria-label="动量排名">
    <div class="trow head" data-head>
      <span>#</span><span>名称</span>
      <span class="num col-wide">最新/今日</span>
      <span>近5日动量</span>
      <span class="num col-wide">近20日</span>
      <span class="num col-wide">量能</span>
      <span class="num col-wide">区间位</span>
      <span class="tagcell">节奏 / 波段信号</span>
    </div>
    <div data-rows></div>
    <div data-rows2></div>
    <p class="more-note" data-f="more"></p>
  </section>

  <footer data-kimi-priority="p3">
    口径：近5日/20日为收盘价区间涨跌幅；量能=近5日日均成交量÷前20日均量；动量条以0轴为基线，红涨绿跌。
    波段信号=现价在20日区间的位置×动量方向：≤30%为低位（蓝=低吸窗口），≥75%为高位（橙=高抛窗口）；参考低吸/高抛价=20日最低/最高收盘。
    数据源：腾讯行情（每日收盘后自动刷新）。信号为规则初判，不代表未来收益，不构成投资建议。
  </footer>
</main>

<script>
(function () {
  // 真实样本（2026-08-17 收盘计算），首次运行前展示
  var SAMPLE = {
    as_of: "2026-08-17 收盘",
    note: "",
    market: [
      { code: "sh000001", name: "上证指数", close: 3973.04, pct: 1.17, ret5: 0.16, ret20: 4.66 },
      { code: "sz399001", name: "深证成指", close: 14339.0, pct: 0.56, ret5: 3.27, ret20: null },
      { code: "sz399006", name: "创业板指", close: 3583.0, pct: 0.96, ret5: 2.71, ret20: null }
    ],
    picks: [
      { code: "512000", name: "券商ETF", close: 0.52, pos20: 5.0, signal: "低位磨底", low20: 0.519, high20: 0.539, holding: false, reason: "20日区间位置 5%，尚未企稳；参考低吸 0.519 / 高抛 0.539" },
      { code: "512880", name: "证券ETF", close: 1.09, pos20: 14.0, signal: "低位磨底", low20: 1.085, high20: 1.128, holding: false, reason: "20日区间位置 14%，尚未企稳；参考低吸 1.085 / 高抛 1.128" },
      { code: "512800", name: "银行ETF", close: 0.80, pos20: 20.0, signal: "低位磨底", low20: 0.79, high20: 0.84, holding: false, reason: "20日区间位置 20%，尚未企稳；参考低吸 0.790 / 高抛 0.840" }
    ],
    etfs: [
      { code: "518880", name: "黄金ETF",       close: 9.103, pct: 1.04,  ret5: 8.26,  ret20: 8.68,  vol_ratio: 2.76, dd20: 0.0,   pos20: 100.0, signal: "高抛窗口", tag: "放量突破" },
      { code: "588170", name: "科创半导体ETF", close: 1.04,  pct: 2.16,  ret5: 20.23, ret20: -14.4, vol_ratio: 0.99, dd20: -7.3,  pos20: 62.0,  signal: "中段观望", tag: "超跌反弹", holding: true },
      { code: "562590", name: "半导体设备ETF", close: 1.07,  pct: 2.39,  ret5: 18.36, ret20: -12.2, vol_ratio: 0.74, dd20: -5.6,  pos20: 66.0,  signal: "中段观望", tag: "超跌反弹" },
      { code: "512480", name: "半导体ETF",     close: 1.088, pct: 1.68,  ret5: 3.61,  ret20: -16.8, vol_ratio: 0.80, dd20: -11.7, pos20: 86.1,  signal: "高抛窗口", tag: "趋势向上" },
      { code: "512000", name: "券商ETF",       close: 0.52,  pct: -0.19, ret5: -1.14, ret20: -1.33, vol_ratio: 0.82, dd20: -3.5,  pos20: 5.0,   signal: "低位磨底", tag: "弱势整理" }
    ]
  };

  function cls(v) { return v > 0.004 ? "up" : v < -0.004 ? "down" : "flat"; }
  function fmt(v, d) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    return (v > 0 ? "+" : "") + Number(v).toFixed(d === undefined ? 2 : d);
  }
  function tagClass(t) {
    if (t === "放量突破" || t === "超跌反弹") return "tag hot";
    if (t === "弱势整理") return "tag weak";
    return "tag";
  }
  function sigClass(s) {
    if (s === "低吸窗口") return "sig buy";
    if (s === "高抛窗口") return "sig sell";
    return "sig";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  }

  function render(data) {
    var main = (data && data.main) || SAMPLE;
    var etfs = (main.etfs || []).slice().sort(function (a, b) { return (b.ret5 || -999) - (a.ret5 || -999); });
    document.querySelector('[data-f="asof"]').textContent = main.as_of || "—";

    var w = etfs[0];
    if (w) {
      document.querySelector('[data-f="winner"]').textContent = w.name;
      var wo = document.querySelector('[data-f="winner_ret"]');
      wo.textContent = fmt(w.ret5) + "%";
      wo.className = cls(w.ret5);
      var wt = document.querySelector('[data-f="winner_tag"]');
      wt.textContent = w.tag || "—";
      wt.className = tagClass(w.tag);
    }

    // 低吸潜力条
    var pkBox = document.querySelector("[data-picks]");
    var pkRows = document.querySelector("[data-pick-rows]");
    var picks = main.picks || [];
    if (picks.length) {
      pkBox.hidden = false;
      pkRows.innerHTML = "";
      picks.forEach(function (p) {
        var d = document.createElement("div");
        d.className = "pick" + (p.holding ? " holding" : "");
        d.innerHTML = '<span class="pn">' + esc(p.name) + "</span>" +
          '<span class="' + sigClass(p.signal) + '">' + esc(p.signal) + "</span>" +
          '<span class="pr">' + esc(p.reason || "") + "</span>";
        pkRows.appendChild(d);
      });
    } else {
      pkBox.hidden = true;
      pkRows.innerHTML = "";
    }

    // 市场状态条
    var mk = document.querySelector("[data-market]");
    mk.innerHTML = "";
    (main.market || []).forEach(function (m) {
      var d = document.createElement("div");
      d.className = "mitem";
      d.innerHTML = '<span class="mname"></span><output class=""></output><span class="m5"></span>';
      d.querySelector(".mname").textContent = m.name;
      var o = d.querySelector("output");
      o.textContent = fmt(m.pct) + "%";
      o.className = cls(m.pct);
      d.querySelector(".m5").textContent = "5日 " + fmt(m.ret5) + "%";
      mk.appendChild(d);
    });

    // 动量条比例尺
    var maxAbs = 1;
    etfs.forEach(function (e) { maxAbs = Math.max(maxAbs, Math.abs(e.ret5 || 0)); });

    var expanded = document.documentElement.getAttribute("data-daimon-size-tier") === "expanded";
    var topN = expanded ? 10 : 5;
    var rowsEl = document.querySelector("[data-rows]");
    var rows2El = document.querySelector("[data-rows2]");
    rowsEl.innerHTML = "";
    rows2El.innerHTML = "";

    etfs.forEach(function (e, i) {
      var row = document.createElement("div");
      row.className = "trow" + (i < 3 ? " top" : "") + (e.holding ? " holding" : "");
      var pctBar = Math.min(50, Math.abs(e.ret5 || 0) / maxAbs * 50);
      var barCls = (e.ret5 || 0) >= 0 ? "bar pos" : "bar neg";
      var barStyle = (e.ret5 || 0) >= 0 ? "width:" + pctBar + "%" : "width:" + pctBar + "%";
      row.innerHTML =
        '<span class="rank">' + (i + 1) + "</span>" +
        '<span class="name"><span class="n" title="' + e.name + '">' + e.name + '</span><span class="c">' + e.code + "</span></span>" +
        '<span class="num col-wide"><span class="' + cls(e.pct) + '">' + fmt(e.pct) + '%</span></span>' +
        '<span class="bar-cell"><span class="bar-track"><span class="' + barCls + '" style="' + barStyle + '"></span></span>' +
        '<span class="bar-val ' + cls(e.ret5) + '">' + fmt(e.ret5) + "%</span></span>" +
        '<span class="num col-wide ' + cls(e.ret20) + '">' + fmt(e.ret20) + "%</span>" +
        '<span class="num col-wide">' + (e.vol_ratio ? Number(e.vol_ratio).toFixed(1) + "x" : "—") + "</span>" +
        '<span class="num col-wide">' + (e.pos20 === null || e.pos20 === undefined ? "—" : Number(e.pos20).toFixed(0) + "%") + "</span>" +
        '<span class="tagcell"><span class="' + tagClass(e.tag) + '">' + (e.tag || "—") + "</span>" +
        '<span class="' + sigClass(e.signal) + '">' + (e.signal || "—") + "</span></span>";
      if (i < topN) rowsEl.appendChild(row);
      else if (expanded) rows2El.appendChild(row);
    });

    var more = document.querySelector('[data-f="more"]');
    if (!expanded && etfs.length > topN) {
      more.textContent = "还有 " + (etfs.length - topN) + " 只 · 放大查看完整榜单";
    } else {
      more.textContent = "";
    }
  }

  if (window.DaimonWidget && window.DaimonWidget.onDataChange) {
    window.DaimonWidget.onDataChange(render);
  } else {
    render(null);
  }
})();
</script>
</body>
</html>
